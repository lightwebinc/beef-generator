# Scheduled vulnerability scan: an advisory published against a dependency does
# not wait for a commit, so a quiet repo is re-scanned on a clock.
name: Vuln scan

on:
  schedule:
    # Tue + Fri 04:00 UTC, ahead of the dependency-update runs the same day.
    - cron: "0 4 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    uses: lightwebinc/ci/.github/workflows/govulncheck.yml@fcb564d49f07d6002441feb9d97ae3ce561e0f17 # v0.6.2
