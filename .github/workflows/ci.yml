name: CI

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: lightwebinc/ci/.github/workflows/go-host.yml@4bd810e61f5ffae2db7054a58d6e519368b40f00 # v0.6.0
    with:
      gofmt: true
      tidy-check: true

  govulncheck:
    uses: lightwebinc/ci/.github/workflows/govulncheck.yml@4bd810e61f5ffae2db7054a58d6e519368b40f00 # v0.6.0
