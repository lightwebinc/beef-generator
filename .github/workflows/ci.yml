name: CI

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: lightwebinc/ci/.github/workflows/go-host.yml@5e3a118fc997d254cbc49b9bf14c4fd3ec3974d0 # v0.7.2
    with:
      gofmt: true
      tidy-check: true
      licences-check: true

  govulncheck:
    uses: lightwebinc/ci/.github/workflows/govulncheck.yml@5e3a118fc997d254cbc49b9bf14c4fd3ec3974d0 # v0.7.2
