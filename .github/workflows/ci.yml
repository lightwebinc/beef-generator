name: CI

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: lightwebinc/ci/.github/workflows/go-host.yml@3c61864e6d822d16119858e525129ea5c400d4d7 # v0.4.0
    with:
      gofmt: true
      tidy-check: true

  govulncheck:
    uses: lightwebinc/ci/.github/workflows/govulncheck.yml@3c61864e6d822d16119858e525129ea5c400d4d7 # v0.4.0
