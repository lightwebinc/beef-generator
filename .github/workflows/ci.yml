name: CI

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: lightwebinc/ci/.github/workflows/go-host.yml@a5956ef6306c9df9ea212546ebe3e240b5315669 # v0.5.2
    with:
      gofmt: true
      tidy-check: true

  govulncheck:
    uses: lightwebinc/ci/.github/workflows/govulncheck.yml@a5956ef6306c9df9ea212546ebe3e240b5315669 # v0.5.2
